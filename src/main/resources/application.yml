spring:
  application:
    name: CustomAI
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 20MB

  datasource:
    url: jdbc:mysql://localhost:3306/customai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      validation-query: SELECT 1 from DUAL

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 4000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 8
          min-idle: 2
server:
  port: 8113

# AI ??
mybatis:
  type-aliases-package: io.g8.customai.user.entity
  configuration:
    map-underscore-to-camel-case: true
jwt:
  secret: ${DASHSCOPE_KEY}+"$"+${DEEPSEEK_KEY}
  expiration: 86400

vip:
  auth:
    key: $$$$$$$$$$


logging:
  level:

    # Mapper:MyBatis
    io.g8.customai.user.mapper: trace

    # Spring Boot
    org.springframework.core: debug
    org.springframework.web: debug
    org.springframework.transaction: debug
    org.springframework.data.jpa: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
langchain4j:
  community:
    dashscope:
#      chat-model:
#        api-key: ${DASHSCOPE_KEY}
#        parameters:
#          max-output-tokens: 8000
#        model-name: qwen-turbo
      streaming-chat-model:
        api-key: ${DASHSCOPE_KEY}
        model-name: qwen-turbo
        parameters:
            max-output-tokens: 8000
      embedding-model:
        api-key: ${DASHSCOPE_KEY}
  open-ai:
    chat-model:
      api-key: ${DEEPSEEK_KEY}
      base-url: https://api.deepseek.com/v1/
      model-name: deepseek-chat
customai:
  kb:
    chroma-collection: java-rag
    chroma-url: http://localhost:8111
    ollama-model-embed: bge-m3
    ollama-url: http://localhost:11434
  chat:

